<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stop browser auto-translate from rewriting React-managed text nodes:
         translation extensions wrap DOM in <font>/spans, desync the virtual DOM
         from real DOM, and intermittently trigger "Failed to execute 'removeChild'".
         notranslate also stops the truncated "Federico Fell…" → "费德里科跌倒" artifact. -->
    <meta name="google" content="notranslate" />
    <title>Channel3 × PayPal Agentic Commerce</title>
    <meta name="description" content="An authorization-boundary shopping agent using Channel3 products and a local mock dataset, with PayPal checkout." />
    <meta property="og:title" content="Channel3 × PayPal Agentic Commerce" />
    <meta property="og:description" content="Agentic shopping with explicit authorization boundaries, Channel3 product search, local fallback data, and PayPal checkout." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Channel3 × PayPal Agentic Commerce" />
    <meta name="twitter:description" content="Agentic shopping with explicit authorization boundaries and PayPal checkout." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
